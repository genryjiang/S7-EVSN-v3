version: 0.2

env:
  variables:
    DOCKER_BUILDKIT: "1"
    QNX_SDP_KEY: qnx/qnx-sdp.tar.gz
    QNX_LICENSE_KEY: qnx/qnx-license.tar.gz
    RTI_KEY: rti/rti_connext-7.3.1.tar.gz
    IMAGE_TAG_PREFIX: dev-env-builder-amd64
    QNX_SDP_VERSION: "8.0"
    QNX_MOSQUITTO_REF: 35aa903edcceedc2c8010c4c47c7a316a89c9725

phases:
  pre_build:
    commands:
      - ': "${AWS_DEFAULT_REGION:?AWS_DEFAULT_REGION is required}"'
      - ': "${AWS_ACCOUNT_ID:?AWS_ACCOUNT_ID is required}"'
      - ': "${ECR_URL:?ECR_URL is required}"'
      - ': "${IMAGE_REPO_NAME:?IMAGE_REPO_NAME is required}"'
      - ': "${S3_BUCKET:?S3_BUCKET is required}"'
      - mkdir -p artifacts
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_URL"
      - SOURCE_VERSION="${CODEBUILD_RESOLVED_SOURCE_VERSION:-manual}"
      - GIT_HASH="$(printf '%s' "$SOURCE_VERSION" | cut -c1-6)"
      - if [ -z "$GIT_HASH" ] || [ "$GIT_HASH" = "manual" ]; then GIT_HASH="$(date +%Y%m%d%H%M%S)"; fi
      - IMAGE_TAG="${IMAGE_TAG_PREFIX}-${GIT_HASH}"
      - IMAGE_LATEST_TAG="${IMAGE_TAG_PREFIX}-latest"
      - aws s3 cp "s3://${S3_BUCKET}/${QNX_SDP_KEY}" "artifacts/qnx800.tar.gz"
      - aws s3 cp "s3://${S3_BUCKET}/${RTI_KEY}" "artifacts/rti_connext-7.3.1.tar.gz"
      - aws s3 cp "s3://${S3_BUCKET}/${QNX_LICENSE_KEY}" "artifacts/qnx_license.tar.gz"
      - docker pull "$ECR_URL/$IMAGE_REPO_NAME:$IMAGE_LATEST_TAG" || true
  build:
    commands:
      - >
        docker build --progress=plain --platform linux/amd64
        -f docker/Dockerfile
        --cache-from "$ECR_URL/$IMAGE_REPO_NAME:$IMAGE_LATEST_TAG"
        --build-arg USER_NAME=developer
        --build-arg GROUP_NAME=developer
        --build-arg USER_ID=1000
        --build-arg GROUP_ID=1000
        --build-arg QNX_SDP_VERSION="$QNX_SDP_VERSION"
        --build-arg QNX_MOSQUITTO_REF="$QNX_MOSQUITTO_REF"
        -t "$ECR_URL/$IMAGE_REPO_NAME:$IMAGE_TAG"
        .
      - docker tag "$ECR_URL/$IMAGE_REPO_NAME:$IMAGE_TAG" "$ECR_URL/$IMAGE_REPO_NAME:$IMAGE_LATEST_TAG"
  post_build:
    commands:
      - |
        if [ "${CODEBUILD_BUILD_SUCCEEDING:-0}" != "1" ]; then
          echo "Skipping docker push because the build phase failed."
          exit 1
        fi
      - echo "Pushing docker images..."
      - docker push "$ECR_URL/$IMAGE_REPO_NAME:$IMAGE_TAG"
      - docker push "$ECR_URL/$IMAGE_REPO_NAME:$IMAGE_LATEST_TAG"
